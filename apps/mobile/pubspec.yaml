name: vincecore
description: VINCECORE - Personal Fitness Performance System.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  provider: ^6.0.5
  flutter_bloc: ^8.1.3
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0
  fitflow_contracts:
    path: ../../packages/contracts/flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - ../../packages/contracts/data/exercises.json
